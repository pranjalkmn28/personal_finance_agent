<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Finance Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f0e;
    --surface: #161a18;
    --surface2: #1e2421;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #e8ede9;
    --muted: #7a8c80;
    --accent: #3fd68f;
    --accent-dim: rgba(63,214,143,0.12);
    --accent-dim2: rgba(63,214,143,0.06);
    --danger: #f97066;
    --warn: #f5a623;
    --mono: 'DM Mono', monospace;
    --sans: 'Syne', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: grid;
    grid-template-columns: 280px 1fr;
    grid-template-rows: 56px 1fr;
  }

  /* ── Header ── */
  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }
  .logo-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; }
  .logo-text { font-size: 14px; font-weight: 600; letter-spacing: 0.04em; }
  .logo-badge {
    margin-left: auto;
    font-size: 11px;
    font-family: var(--mono);
    color: var(--accent);
    background: var(--accent-dim);
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: 0.06em;
  }

  /* ── Sidebar ── */
  aside {
    border-right: 1px solid var(--border);
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow-y: auto;
  }
  .sidebar-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    padding: 0 8px;
    margin-bottom: 4px;
    margin-top: 12px;
  }
  .sidebar-label:first-child { margin-top: 0; }

  .suggestion {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 12.5px;
    line-height: 1.4;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
  }
  .suggestion:hover {
    background: var(--surface2);
    border-color: var(--border2);
  }
  .suggestion .tag {
    display: block;
    font-size: 10px;
    color: var(--accent);
    font-family: var(--mono);
    margin-bottom: 3px;
    letter-spacing: 0.04em;
  }

  /* ── Main chat area ── */
  main {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #chat-window {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scroll-behavior: smooth;
  }

  /* ── Empty state ── */
  .empty-state {
    margin: auto;
    text-align: center;
    max-width: 360px;
    opacity: 0.7;
  }
  .empty-state .big-icon {
    font-size: 48px;
    margin-bottom: 16px;
    display: block;
  }
  .empty-state h2 { font-size: 18px; font-weight: 500; margin-bottom: 8px; }
  .empty-state p { font-size: 13px; color: var(--muted); line-height: 1.6; }

  /* ── Messages ── */
  .msg { display: flex; gap: 12px; max-width: 800px; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }

  .avatar {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .avatar.user { background: var(--accent-dim); color: var(--accent); }
  .avatar.agent { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }

  .bubble {
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13.5px;
    line-height: 1.65;
    max-width: 600px;
  }
  .msg.user .bubble {
    background: var(--accent-dim);
    border: 1px solid rgba(63,214,143,0.2);
    color: var(--text);
  }
  .msg.agent .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
  }

  /* ── ReAct trace ── */
  .trace-toggle {
    font-size: 11px;
    font-family: var(--mono);
    color: var(--muted);
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    margin-top: 8px;
    transition: all 0.15s;
  }
  .trace-toggle:hover { border-color: var(--border2); color: var(--text); }

  .trace-panel {
    display: none;
    margin-top: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .trace-panel.open { display: block; }

  .trace-step {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-family: var(--mono);
  }
  .trace-step:last-child { border-bottom: none; }
  .trace-step-label {
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .trace-step.thought .trace-step-label { color: #7c9eff; }
  .trace-step.action .trace-step-label { color: var(--warn); }
  .trace-step.observation .trace-step-label { color: var(--accent); }
  .trace-step pre {
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.5;
    color: var(--muted);
    font-size: 11.5px;
  }

  /* ── Loading ── */
  .loading-dots { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
  .loading-dots span {
    width: 5px; height: 5px;
    background: var(--muted);
    border-radius: 50%;
    animation: dot-bounce 1.2s infinite ease-in-out;
  }
  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dot-bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* ── Input bar ── */
  .input-bar {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  #query-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 13.5px;
    resize: none;
    min-height: 46px;
    max-height: 120px;
    line-height: 1.5;
    outline: none;
    transition: border-color 0.15s;
  }
  #query-input:focus { border-color: rgba(63,214,143,0.4); }
  #query-input::placeholder { color: var(--muted); }

  #send-btn {
    width: 46px;
    height: 46px;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    color: #0d0f0e;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.15s;
    font-size: 18px;
  }
  #send-btn:hover { opacity: 0.85; }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── API Key setup ── */
  .setup-banner {
    margin: 16px 24px 0;
    background: rgba(249,112,102,0.08);
    border: 1px solid rgba(249,112,102,0.25);
    border-radius: 10px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
  }
  .setup-banner.hidden { display: none; }
  .setup-banner input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    outline: none;
  }
  .setup-banner button {
    background: var(--danger);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 12px;
    font-family: var(--sans);
    cursor: pointer;
  }

  .answer-text { white-space: pre-wrap; }
</style>
</head>
<body>

<header>
  <div class="logo-dot"></div>
  <span class="logo-text">Finance Agent</span>
  <span class="logo-badge">ReAct · LangChain · Week 2</span>
</header>

<aside>
  <div class="sidebar-label">Summaries</div>
  <button class="suggestion" onclick="sendQuery(this.dataset.q)" data-q="Give me a financial summary for January 2024">
    <span class="tag">calculate_summary</span>
    January 2024 summary
  </button>
  <button class="suggestion" onclick="sendQuery(this.dataset.q)" data-q="Compare my savings rate in January vs February 2024">
    <span class="tag">calculate_summary × 2</span>
    Compare Jan vs Feb savings
  </button>

  <div class="sidebar-label">Spending</div>
  <button class="suggestion" onclick="sendQuery(this.dataset.q)" data-q="Break down my spending by category for February 2024">
    <span class="tag">categorize_spending</span>
    Feb category breakdown
  </button>
  <button class="suggestion" onclick="sendQuery(this.dataset.q)" data-q="How much did I spend on food and dining across both months?">
    <span class="tag">get_transactions</span>
    Total food spend
  </button>

  <div class="sidebar-label">Analysis</div>
  <button class="suggestion" onclick="sendQuery(this.dataset.q)" data-q="Are there any unusual transactions I should know about?">
    <span class="tag">flag_anomalies</span>
    Detect anomalies
  </button>
  <button class="suggestion" onclick="sendQuery(this.dataset.q)" data-q="What are my top 3 biggest expenses in January?">
    <span class="tag">get_transactions</span>
    Top expenses Jan
  </button>
  <button class="suggestion" onclick="sendQuery(this.dataset.q)" data-q="How much did I spend on Uber rides in total?">
    <span class="tag">get_transactions</span>
    Total Uber spend
  </button>
  <button class="suggestion" onclick="sendQuery(this.dataset.q)" data-q="Am I spending more or less on shopping in February vs January?">
    <span class="tag">categorize_spending × 2</span>
    Shopping comparison
  </button>
</aside>

<main>
  <div class="setup-banner" id="setup-banner">
    <span style="color:var(--danger)">⚠</span>
    <span style="color:var(--muted)">Set your API URL (default: localhost:8000)</span>
    <input type="text" id="api-url-input" placeholder="http://localhost:8000" value="http://localhost:8000">
    <button onclick="saveApiUrl()">Save</button>
  </div>

  <div id="chat-window">
    <div class="empty-state" id="empty-state">
      <span class="big-icon">💳</span>
      <h2>Personal Finance Agent</h2>
      <p>Ask anything about your transactions. The agent will pick the right tool, run it, and reason over the results.</p>
    </div>
  </div>

  <div class="input-bar">
    <textarea id="query-input" placeholder="Ask about your spending, savings, or transactions…" rows="1"></textarea>
    <button id="send-btn" onclick="handleSend()" title="Send">↑</button>
  </div>
</main>

<script>
let API_URL = localStorage.getItem('finance_agent_url') || 'http://localhost:8000';
document.getElementById('api-url-input').value = API_URL;

function saveApiUrl() {
  API_URL = document.getElementById('api-url-input').value.trim();
  localStorage.setItem('finance_agent_url', API_URL);
  document.getElementById('setup-banner').classList.add('hidden');
}

const input = document.getElementById('query-input');
const sendBtn = document.getElementById('send-btn');

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

function sendQuery(query) {
  input.value = query;
  handleSend();
}

async function handleSend() {
  const query = input.value.trim();
  if (!query) return;

  document.getElementById('empty-state')?.remove();
  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;

  appendMessage('user', query);
  const loadingEl = appendLoading();

  try {
    const res = await fetch(`${API_URL}/query`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query })
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || `HTTP ${res.status}`);
    }

    const data = await res.json();
    loadingEl.remove();
    appendAgentMessage(data.answer, data.steps);

  } catch (err) {
    loadingEl.remove();
    appendMessage('agent', `Error: ${err.message}\n\nMake sure your FastAPI server is running:\n  python server.py`);
  }

  sendBtn.disabled = false;
  input.focus();
}

function appendMessage(role, text) {
  const chat = document.getElementById('chat-window');
  const msg = document.createElement('div');
  msg.className = `msg ${role}`;
  msg.innerHTML = `
    <div class="avatar ${role}">${role === 'user' ? 'U' : 'AI'}</div>
    <div class="bubble"><div class="answer-text">${escapeHtml(text)}</div></div>
  `;
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
  return msg;
}

function appendAgentMessage(answer, steps) {
  const chat = document.getElementById('chat-window');
  const msg = document.createElement('div');
  msg.className = 'msg agent';

  const traceId = `trace-${Date.now()}`;

  let traceHtml = '';
  if (steps && steps.length > 0) {
    const stepsHtml = steps.map((step, i) => {
      const thoughtAction = escapeHtml(step.thought_action);
      const observation = escapeHtml(step.observation);
      return `
        <div class="trace-step thought">
          <div class="trace-step-label">Step ${i+1} — Thought / Action</div>
          <pre>${thoughtAction}</pre>
        </div>
        <div class="trace-step observation">
          <div class="trace-step-label">Observation</div>
          <pre>${observation}</pre>
        </div>
      `;
    }).join('');

    traceHtml = `
      <button class="trace-toggle" onclick="toggleTrace('${traceId}')">
        ▸ show reasoning trace (${steps.length} step${steps.length > 1 ? 's' : ''})
      </button>
      <div class="trace-panel" id="${traceId}">${stepsHtml}</div>
    `;
  }

  msg.innerHTML = `
    <div class="avatar agent">AI</div>
    <div>
      <div class="bubble"><div class="answer-text">${escapeHtml(answer)}</div></div>
      ${traceHtml}
    </div>
  `;

  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

function appendLoading() {
  const chat = document.getElementById('chat-window');
  const msg = document.createElement('div');
  msg.className = 'msg agent';
  msg.innerHTML = `
    <div class="avatar agent">AI</div>
    <div class="bubble">
      <div class="loading-dots"><span></span><span></span><span></span></div>
    </div>
  `;
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
  return msg;
}

function toggleTrace(id) {
  const panel = document.getElementById(id);
  const btn = panel.previousElementSibling;
  panel.classList.toggle('open');
  btn.textContent = panel.classList.contains('open')
    ? btn.textContent.replace('▸ show', '▾ hide')
    : btn.textContent.replace('▾ hide', '▸ show');
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
</script>
</body>
</html>
